<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Real-Time Object Detection</title><style>body{margin:0;background:#0b1020;color:#eef2ff;font-family:Arial,sans-serif}main{max-width:1000px;margin:auto;padding:24px}.card{background:#151c32;border:1px solid #293454;border-radius:18px;padding:20px;box-shadow:0 12px 40px #0004}h1{margin-top:0}.stage{position:relative;max-width:900px;margin:18px auto;background:#050812;border-radius:14px;overflow:hidden}video{display:block;width:100%}canvas{position:absolute;inset:0;width:100%;height:100%}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:10px;padding:11px 16px;background:#5b7cfa;color:white;font-weight:700;cursor:pointer}.stat{padding:9px 12px;background:#202a47;border-radius:9px}.ok{color:#6ee7b7}.err{color:#fca5a5;word-break:break-word}</style></head><body><main><div class="card"><h1>🎯 Real-Time Object Detection</h1><p>Browser camera → Flask API → YOLOv4-tiny</p><div class="bar"><button id="start" class="btn">Start Camera</button><button id="stop" class="btn">Stop</button><span id="status" class="stat">Ready</span><span id="fps" class="stat">FPS: 0</span><span id="count" class="stat">Objects: 0</span></div><div class="stage"><video id="video" autoplay muted playsinline></video><canvas id="canvas"></canvas></div><p id="error" class="err"></p></div></main><script>const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),statusEl=document.getElementById('status'),fpsEl=document.getElementById('fps'),countEl=document.getElementById('count'),errorEl=document.getElementById('error');let stream=null,running=false,last=performance.now(),frames=0,lastSend=0,busy=false;const sendCanvas=document.createElement('canvas'),sctx=sendCanvas.getContext('2d');async function start(){errorEl.textContent='';try{const h=await fetch('/health',{cache:'no-store'});const hd=await h.json().catch(()=>({error:'Server returned non-JSON response'}));if(!h.ok)throw Error(hd.error||'Server/model is not ready');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=stream;running=true;statusEl.textContent='Camera running';statusEl.className='stat ok';requestAnimationFrame(loop)}catch(e){statusEl.textContent='Error';statusEl.className='stat err';errorEl.textContent=e.message}}function stop(){running=false;busy=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;ctx.clearRect(0,0,canvas.width,canvas.height);statusEl.textContent='Stopped';statusEl.className='stat'}async function detect(){if(video.videoWidth===0||busy)return;busy=true;sendCanvas.width=video.videoWidth;sendCanvas.height=video.videoHeight;sctx.drawImage(video,0,0);sendCanvas.toBlob(async b=>{try{const r=await fetch('/detect',{method:'POST',body:(()=>{const f=new FormData();f.append('image',b,'frame.jpg');return f})()});const text=await r.text();let d;try{d=JSON.parse(text)}catch(_){throw Error('Server returned HTML instead of JSON (HTTP '+r.status+'). Check Render logs.')}if(!r.ok)throw Error(d.error||'Detection failed');draw(d);countEl.textContent='Objects: '+d.detections.length;frames++;const now=performance.now();if(now-last>1000){fpsEl.textContent='FPS: '+frames;frames=0;last=now}}catch(e){errorEl.textContent=e.message}finally{busy=false}},'image/jpeg',.65)}function draw(d){canvas.width=d.width;canvas.height=d.height;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.lineWidth=2;ctx.font='bold 14px Arial';d.detections.forEach(o=>{ctx.strokeStyle='#43f08a';ctx.fillStyle='#43f08a';ctx.strokeRect(o.x,o.y,o.width,o.height);const text=o.label+' '+Math.round(o.confidence*100)+'%';const tw=ctx.measureText(text).width+10;ctx.fillRect(o.x,Math.max(0,o.y-22),tw,22);ctx.fillStyle='#07120c';ctx.fillText(text,o.x+5,Math.max(16,o.y-6))})}function loop(t){if(!running)return;if(t-lastSend>300){lastSend=t;detect()}requestAnimationFrame(loop)}document.getElementById('start').onclick=start;document.getElementById('stop').onclick=stop;</script></body></html>
